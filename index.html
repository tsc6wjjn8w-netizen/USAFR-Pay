<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserve Pay &amp; Currency Planner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17222e;--mute:#5d6b7a;--line:#d5dce3;--acc:#245a8d;--acc-ink:#fff;--ok:#2b7a50;--warn:#a96a0c;--bad:#b0362b;--okbg:#e2f1e8;--warnbg:#fbefd6;--badbg:#f8e1de;--ftp:#2b7a50;--gtp:#7a4fb0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171f;--card:#18222d;--ink:#e6ecf2;--mute:#93a1b0;--line:#2b3947;--acc:#6aa6dc;--acc-ink:#0b1520;--ok:#6cc596;--warn:#e0a448;--bad:#ef8b80;--okbg:#1b3328;--warnbg:#3a2d14;--badbg:#3c1f1c;--ftp:#6cc596;--gtp:#b99be6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171f;--card:#18222d;--ink:#e6ecf2;--mute:#93a1b0;--line:#2b3947;--acc:#6aa6dc;--acc-ink:#0b1520;--ok:#6cc596;--warn:#e0a448;--bad:#ef8b80;--okbg:#1b3328;--warnbg:#3a2d14;--badbg:#3c1f1c;--ftp:#6cc596;--gtp:#b99be6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
body.lock{overflow:hidden}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
h1{font:600 26px/1.2 "IBM Plex Serif",Georgia,serif;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 16px;max-width:62ch}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:500 15px inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:9px 14px;font:500 14px inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row>div{flex:1 1 130px}
.big{font:600 34px/1.1 "IBM Plex Serif",Georgia,serif}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.planned{background:var(--warn);opacity:.55}
.bar{display:flex}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:13px}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.plan{background:var(--line);color:var(--mute)}
.tip{border-left:4px solid var(--line);padding:6px 12px;margin:8px 0}
.tip.ok{border-color:var(--ok)}.tip.warn{border-color:var(--warn)}.tip.bad{border-color:var(--bad)}
.mute{color:var(--mute);font-size:13px}
.pt{min-width:920px}.pt td,.pt th{white-space:nowrap;padding:5px 7px;font-size:12px}.pt td:first-child,.pt th:first-child{position:sticky;left:0;background:var(--card);font-weight:600}.pt td.sel{background:var(--okbg);font-weight:600}
a{color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal .h{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.cal button{min-height:92px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;font-size:12px;display:flex;flex-direction:column;justify-content:space-between;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.cal button.press{transform:scale(.95);outline:2px solid var(--acc)}
.cal button.out{opacity:.45}.cal button.today{border:2px solid var(--acc)}.cal button.sel{background:var(--card);outline:2px solid var(--acc)}
.dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-duty{background:var(--acc)}.d-plan{border:2px solid var(--acc)}.d-cur{background:var(--warn)}.d-curbad{background:var(--bad)}.d-trav{background:var(--ok)}.d-tp{background:var(--mute)}.d-ftp{background:var(--ftp)}.d-gtp{background:var(--gtp)}
.ev{display:flex;align-items:center;gap:3px;font-size:10px;line-height:1.25;white-space:nowrap;overflow:hidden;max-width:100%}.ev .dot{flex:0 0 8px}.ev span{overflow:hidden;text-overflow:ellipsis}
.ev .tm{color:var(--mute);flex:0 1 auto;margin-left:2px}
@media (max-width:600px){.ev{flex-wrap:wrap;row-gap:0}.ev .tm{flex-basis:100%;margin-left:11px}}
.sl{font-size:10px;line-height:1.2;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}.leg span{display:inline-flex;gap:5px;align-items:center}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--mute);text-align:center;margin:6px 0 8px}
.pchip{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;line-height:1.35;cursor:pointer}
.pchip.open{color:var(--mute);border-style:dashed;cursor:default}
.pchip .mute{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:10px}
@media (min-width:600px){.ov{align-items:center}}
.dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:100%;max-width:500px;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.dlg h2{margin:0}
.prow{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.prow.k-uta{border-left-color:var(--acc)}.prow.k-ftp{border-left-color:var(--ftp)}.prow.k-gtp{border-left-color:var(--gtp)}
.prow .hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:420px){.prow{grid-template-columns:1fr 1fr}.prow .w{grid-column:1/-1}}
.chip{display:inline-block;font-weight:600;font-size:13px;padding:1px 10px;border-radius:10px;color:#fff}
.chip.k-uta{background:var(--acc);color:var(--acc-ink)}.chip.k-ftp{background:var(--ftp);color:var(--card)}.chip.k-gtp{background:var(--gtp);color:var(--card)}
.adds{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.adds .btn{flex:1 1 120px}
.dayact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.dayact #cedit,.dayact #cat{grid-column:1/-1}.dayact .btn{padding:9px 6px}
.pdres{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto;margin-top:2px}
.pdres [role=option]{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.pdres [role=option] small{grid-column:1/-1;color:var(--mute);font-size:12px}
.pdres [role=option].hi,.pdres [role=option]:hover{background:var(--bg)}
.pdres .none{padding:10px;color:var(--mute);font-size:13px}
.src{font-size:11px;font-weight:600;padding:0 7px;border-radius:9px;align-self:center}.src.gsa{background:var(--okbg);color:var(--ok)}.src.dos{background:var(--warnbg);color:var(--warn)}.src.dod{background:var(--line);color:var(--acc)}.src.man{background:var(--line);color:var(--mute)}
.pdsel{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
table.mini{min-width:0;width:auto}table.mini th,table.mini td{padding:3px 7px;font-size:12px}table.mini td.on{background:var(--okbg);font-weight:600}
.t24{font-variant-numeric:tabular-nums;letter-spacing:.04em}.t24.bad{border-color:var(--bad);background:var(--badbg)}
.err{color:var(--bad);font-size:13px;min-height:1.3em;margin:4px 0}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mute);font-size:13px;margin:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Reserve pay &amp; currency planner</h1>
<p class="sub">Log duty by pay status, watch your retirement points, and let the planner line up currency items with paid days. Everything stays in this browser. Keep entries generic: no PII, unit details or CUI.</p>
<nav role="tablist" id="tabs"></nav>
<div id="view"></div>
</main>
<div id="modal"></div>
<script>
const KEY="reserve-planner-v1";
const DEF={rate:0,member:15,yearStart:"",types:[
{id:"uta",name:"UTA / IDT period",unit:"period",pts:1,paid:true},
{id:"at",name:"Annual training (AT)",unit:"day",pts:1,paid:true},
{id:"mpa",name:"MPA day",unit:"day",pts:1,paid:true},
{id:"rpa",name:"RPA day",unit:"day",pts:1,paid:true},
{id:"ados",name:"ADOS / ADT / school",unit:"day",pts:1,paid:true},
{id:"pts",name:"Points only (no pay)",unit:"period",pts:1,paid:false}],duty:[],curr:[],vouchers:[]};
let S=load(),tab="dash";
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign({},DEF,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=s=>pd(typeof s==="string"?s:iso(s)).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
const money=n=>n.toLocaleString(undefined,{style:"currency",currency:"USD"});
const T=id=>S.types.find(t=>t.id===id)||{name:"Unknown",pts:0,paid:false,unit:"day"};

function yearWindow(){
  const t=today();
  if(!S.yearStart)return{s:new Date(t.getFullYear(),0,1),e:new Date(t.getFullYear(),11,31),set:false};
  const a=pd(S.yearStart);let s=new Date(t.getFullYear(),a.getMonth(),a.getDate());
  if(s>t)s=new Date(t.getFullYear()-1,a.getMonth(),a.getDate());
  return{s,e:addDays(new Date(s.getFullYear()+1,s.getMonth(),s.getDate()),-1),set:true};
}
const PS=[["none","Not submitted"],["submitted","Submitted"],["paid","Paid"]];
const psName=k=>(PS.find(x=>x[0]===(k||"none"))||PS[0])[1];
function setPs(e,ps){if(!e)return;e.ps=ps;if(ps==="none")e.sdate="";else if(!e.sdate)e.sdate=iso(today());e.pdate=ps==="paid"?(e.pdate||iso(today())):""}
const hasManual=d=>d.manual!==undefined&&d.manual!==""&&d.manual!==null;
const dutyPay=d=>hasManual(d)?Number(d.manual)||0:(T(d.type).paid?d.units*S.rate:0);
const ageTxt=s=>{const n=Math.round((today()-pd(s))/864e5);return n<=0?"today":n+"d ago"};
function payTotals(){const w=yearWindow(),t=today(),r={none:0,submitted:0,paid:0};S.duty.forEach(d=>{const dt=pd(d.date);if(dt<w.s||dt>w.e||dt>t)return;r[d.ps||"none"]+=dutyPay(d)});return r}
function voucherTotals(){const r={draft:0,submitted:0,paid:0};S.vouchers.forEach(v=>{r[v.status]+=(v.status==="paid"&&v.paidAmt!==""&&v.paidAmt!=null)?Number(v.paidAmt)||0:Number(v.amount)||0});return r}
function stats(){
  const w=yearWindow(),t=today();let done=0,plan=0,payD=0,payP=0;
  S.duty.forEach(d=>{const dt=pd(d.date);if(dt<w.s||dt>w.e)return;const ty=T(d.type);
    const p=ty.pts*d.units,m=dutyPay(d);
    if(dt<=t){done+=p;payD+=m}else{plan+=p;payP+=m}});
  return{w,done,plan,payD,payP,total:S.member+done};
}
function currInfo(c){
  const due=addDays(pd(c.last),Number(c.interval));
  return{due,left:Math.round((due-today())/864e5)};
}
function advice(){
  const out=[],st=stats(),t=today(),planned=S.duty.filter(d=>pd(d.date)>=t&&T(d.type).paid).map(d=>({...d,dt:pd(d.date)})).sort((a,b)=>a.dt-b.dt);
  S.curr.forEach(c=>{
    const{due,left}=currInfo(c);
    if(left>45)return;
    const before=planned.filter(p=>p.dt<=due&&p.dt>=t);
    const latest=before[before.length-1];
    if(left<0){
      const nxt=planned[0];
      out.push({lv:"bad",t:`<b>${esc(c.name)}</b> lapsed ${-left} day(s) ago. `+(nxt?`Your next paid day is ${fmt(nxt.date)} (${esc(T(nxt.type).name)}). Make this the first event, and confirm no flying or duty requires it before then.`:`No paid day is planned. Add an MPA/RPA or UTA day to regain it on pay.`)});
    }else if(latest){
      out.push({lv:left<=14?"warn":"ok",t:`<b>${esc(c.name)}</b> is good until ${fmt(due)}. Do it on ${fmt(latest.date)} (${esc(T(latest.type).name)}), the last paid day before it lapses. That keeps the work on pay and gets the most out of the interval.`});
    }else{
      out.push({lv:"warn",t:`<b>${esc(c.name)}</b> lapses ${fmt(due)} (${left} days) and no paid day is planned before then. Schedule a paid day on or before ${fmt(addDays(due,-1))} so you aren’t doing it for free.`});
    }
  });
  const w=st.w,rem=Math.max(0,50-st.total);
  if(rem>0){
    const needPlan=Math.max(0,rem-st.plan);
    const left=Math.max(0,Math.round((w.e-t)/864e5));
    out.push({lv:needPlan>0?(left<90?"bad":"warn"):"ok",t:needPlan>0?`<b>Good year:</b> you need ${rem} more point(s) to reach 50, and ${st.plan} are planned. Add ${needPlan} more (about ${Math.ceil(needPlan/4)} drill weekend(s) at 4 periods each, or ${needPlan} active-duty day(s)) in the ${left} days left.`:`<b>Good year:</b> planned duty gets you to 50 points. Keep those days on the calendar.`});
  }else out.push({lv:"ok",t:"<b>Good year:</b> you’ve reached 50 points. Extra days still add retirement points and pay."});
  out.push(...tpAdvice());
  const unsub=S.duty.filter(d=>pd(d.date)<t&&(d.ps||"none")==="none"&&dutyPay(d)>0);
  if(unsub.length)out.push({lv:"warn",t:`<b>Pay:</b> ${unsub.length} completed duty entr${unsub.length>1?"ies":"y"} worth ${money(unsub.reduce((a,d)=>a+dutyPay(d),0))} not marked submitted yet. Submit them so pay isn’t delayed.`});
  const tpUnsub=tpItems().filter(x=>pd(x.date)<t&&(x.ps||"none")==="none").length;
  if(tpUnsub)out.push({lv:"warn",t:`<b>Pay:</b> ${tpUnsub} completed FTP/GTP entr${tpUnsub>1?"ies are":"y is"} not marked submitted yet.`});
  const slow=[...S.duty.filter(d=>d.ps==="submitted"),...S.vouchers.filter(v=>v.status==="submitted"),...tpItems().filter(x=>x.ps==="submitted")].filter(x=>x.sdate&&(t-pd(x.sdate))/864e5>30);
  if(slow.length)out.push({lv:"bad",t:`<b>Follow up:</b> ${slow.length} submission(s) have been waiting more than 30 days. Check status with your finance office.`});
  if(S.vouchers.some(v=>v.status==="draft"))out.push({lv:"warn",t:"<b>Travel:</b> you have draft voucher(s) that haven’t been submitted yet."});
  if(!S.rate)out.push({lv:"warn",t:"Enter your basic daily pay in Settings to see calculated pay, or type amounts in the duty log."});
  if(!S.duty.some(d=>d.type==="at"))out.push({lv:"warn",t:"No annual training logged this year. Plan it early, since it is your largest single block of paid days."});
  return out;
}

function tabs(){
  const L=[["dash","Dashboard"],["duty","Duty log"],["pay","Pay tables"],["trav","Travel vouchers"],["curr","Currencies"],["set","Settings"]];
  $("#tabs").innerHTML=L.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${n}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
}
function tag(c){const{left}=currInfo(c);return left<0?`<span class="tag bad">Lapsed ${-left}d</span>`:left<=14?`<span class="tag warn">${left}d left</span>`:`<span class="tag ok">${left}d left</span>`}

/* ---------- FTP / GTP entries (per day, each with pay status and note) ---------- */
const TPK=[["ftp","fx","Flying"],["gtp","gx","Ground"]];
function tpList(v,k){const x=k==="ftp"?"fx":"gx",n=(v&&v[k])||0,a=[];for(let i=0;i<n;i++){const it=((v[x]||[])[i])||{};a.push({ps:it.ps||"none",note:it.note||"",sdate:it.sdate||"",pdate:it.pdate||"",start:it.start||"",end:it.end||""})}return a}
function tpItems(){const a=[];Object.entries(S.tpd||{}).forEach(([date,v])=>TPK.forEach(([k])=>tpList(v,k).forEach(it=>a.push({...it,date,k}))));return a}
const mil=t=>t?t.replace(':',''):'';
const tmTxt=(a,b)=>a&&b?mil(a)+'\u2013'+mil(b):a?mil(a)+'\u2013':b?'\u2013'+mil(b):'';
/* 24-hour time entry: accepts 0730, 730, 07:30, 7:30, 7 -> stored as HH:MM */
const p24=v=>{v=String(v||'').trim();if(!v)return '';const m=v.match(/^(\d{1,2})(?::?(\d{2}))?$/);if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')};
const t24v=v=>v?mil(v):'';
function t24Mark(el,ok){el.classList.toggle('bad',!ok);el.setAttribute('aria-invalid',ok?'false':'true')}
const utaLbl=id=>{const m=(id||"").match(/^uta-(\d+)-(\d+)-p(\d)$/);return m?new Date(+m[1],+m[2]-1,1).toLocaleDateString(undefined,{month:"short"})+" P"+m[3]:"UTA"};

const CAL={y:today().getFullYear(),m:today().getMonth(),sel:iso(today())};
function calEvents(){
  const E={},add=(k,e)=>{(E[k]=E[k]||[]).push(e)},t=today();
  S.duty.forEach(d=>{const ty=T(d.type),n=Math.max(1,ty.unit==='day'?d.units:Math.ceil(d.units/2)),s=pd(d.date),sm=(d.slot||'').match(/^uta-(\d+)-(\d+)-p(\d)$/),h=hrs(d.start,d.end),mon=sm?new Date(+sm[1],+sm[2]-1,1).toLocaleDateString(undefined,{month:'short'}):'',tid=ty.id||'',who=tid==='uta'?'UTAPS':'pay',stt=d.ps==='paid'?'paid':d.ps==='submitted'?who+' submitted':who+' not submitted',amt=dutyPay(d);
    for(let i=0;i<n;i++){const dt=addDays(s,i),fut=dt>t,nm=sm?'UTA period '+mon+' '+sm[3]+(d.memo?' ('+d.memo+')':''):ty.name+(d.note?' ('+d.note+')':'');
      add(iso(dt),{k:'duty',c:fut?'d-plan':'d-duty',t:nm+(d.start&&d.end?', '+d.start+' to '+d.end+(h?' ('+h.toFixed(1)+' h)':''):'')+(amt?', '+money(amt):'')+', '+(fut?'planned':stt),u:sm?{m:mon,p:sm[3]}:null,s:sm?'':(tid==='pts'?'Pts':tid.toUpperCase()),tm:tmTxt(d.start,d.end),slot:!!sm,uta:tid==='uta'})}});

const DOD_FN={"1":"Effective 01 June 2020, For those non-DoD individuals TDY/PCS or deployed, in support of contingency operations, whose billeting and meals are provided by the USG, the per diem rate for incidentals expenses is $7.00 per day. For those individuals whose billeting and meals are not provided by the USG and are authorized full per diem, the normal locality incidental expense rate is authorized. The maximum per diem rates that apply to travelers authorized to use local hotels and/or restaurants are: Lodging $102, M&IE $100 for Kabul; Lodging $99, M&IE $40 for Herat and Lodging $51, M&IE $50 for Other, Afghanistan. For DoD travelers, the per diem is limited to the rate established by the USCENTCOM Commander.","3":"Effective June 01, 2019: Where meals are included in the lodging rate, a traveler is only allowed a meal rate on the first and last day of travel.","4":"Effective December 01, 2015, The per diem rates listed for Baghdad and “Other”, Iraq, in the main body of this supplement apply to travelers obtaining no-cost lodging on USG civilian compounds or residing with the U.S. military in Iraq. In accordance with FTR Section 301 Appendix B, M&IE must be reduced for all meals provided at no charge by the USG. In that case, the cost of meals, $9, should be deducted from the M&IE of $11. The maximum per diem rates that apply to travelers using local hotels and/or restaurants are: Baghdad: Lodging $100, M&IE $54; Other, Iraq: Lodging $247, M&IE $82. EFFECTIVE: 01 November 2026 MAXIMUM PER DIEM RATES OUTSIDE THE CONTINENTAL UNITED STATES Ch. 728 B-44 TRAVEL PER DIEM ALLOWANCES","5":"San Salvador includes the San Salvador International Airport area of Comalapa.","6":"The per diem rates for Lebanon listed in the main body of this supplement apply to travelers obtaining lodging on USG civilian compounds. The maximum per diem rates that apply to travelers using local hotels and/or restaurants are: Lodging $165, M&IE $75 for Beirut and Other, Lebanon.","8":"Tok  must be reduced for all meals provided by the EFFECTIVE: 01 November 2026 MAXIMUM PER DIEM RATES OUTSIDE THE CONTINENTAL UNITED STATES Ch. 728 B-45 TRAVEL PER DIEM ALLOWANCES","47":"Effective February 1, 2017, Bangkok includes Samutpakan/Suvarnbhumi Airport area.","52":"Effective September 1, 2017 the Per Diem rate for Cambridge is applicable to: RAF Wyton, Huntingdon and Cambridgeshire County.","53":"Effective 12/1/2017, the Per Diem rate for Tunis, Tunisia is applicable to: Carthage, Gammarth and Lamarsa.","54":"Effective February 1, 2018, the maximum per diem rate for Brugge, Belgium is applicable to Ostend, Belgium.","57":"The Per Diem rates listed for Mogadishu, Somalia in the main body of the Per Diem Supplement apply to travelers obtaining lodging on the Compound at no cost to US Mission Travelers with M&IE costs at $66 for a maximum Per Diem rate of $66. The maximum Per Diem rates (Lodging $180 and M&IE $80 for a Per Diem rate of $260) apply to US non-Mission Travelers using local hotels and/or restaurants in Mogadishu, Somalia.","67":"Greater Toronto Area (GTA) consists of the central city of Toronto and the four regional municipalities, which surround it: Durham, Halton, Peel and York.","76":"Niagara Falls, Ontario includes St Catherine’s and Niagara-on-the-Lake","80":"Mbabane, Eswatini includes Manzini and Ezulwini, Eswatini.","82":"Effective November 1, 2020, Netherlands Antilles will no longer be listed in the Per Diem Supplement, the new listings are as follows: Aruba, Aruba; Bonaire, Sint Eustatius, and Saba; Curacao, Curacao; Dutch Caribbean (Other); and Sint Maarten","90":"Effective October 1, 2021, the maximum Per Diem rates for Karachi, Pakistan listed in the main body of the per diem supplement apply to travelers using local hotels and/or restaurants. For travelers obtaining lodging on USG civilian compounds, the on-compound lodging rate is $95.00 and the M&IE rate is $69.00. Please note that the M&IE must be reduced for all meals provided by the USG in accordance with FTR chapter 301, Appendix B.","96":"Effective April 1, 2022, the maximum Per Diem rates or Damascus and Other, Syria listed for in the main body of the per diem supplement apply to travelers using local hotels and/or restaurants. For travelers obtaining free of charge lodging on USG facilities, the lodging rate is $0 and $70.00 M&IE. Please note that the M&IE must be reduced for all meals provided by the USG in accordance with FTR Chapter 301, Appendix B.","135":"Effective January 1, 2026, the Per Diem rate of $704 ($600 for lodging and $104 for M&IE) applies to U.S. government travelers to game park areas as authorized by specific post policy in Tanzania. This rate will expire on December 31, 2026.","150":"Effective October 11, 2026, the maximum lodging rate will increase to $2,500 per night for Singapore, Singapore. Please note that there is no adjustment to the meals or incidental expenses. This temporary lodging rate increase is established for USG travelers who are attending the Singapore International Cyber Week (SICW) for October 11, 2026, only. The footnote will terminate on October 12, 2026. The footnote will be added to the Per Diem ALDAC publication effective November 1, 2026 for reporting purposes only and will be removed for the December 1, 2026 publication.","152":"Effective November 1, 2026, the maximum lodging rate will increase to $304 per night for Manila, Philippines. Please note that there is no adjustment to the meals or incidental expenses. This temporary lodging rate increase is established for USG travelers who are attending the 49th ASEAN Leaders’ Summit during the period of November 12, 2026 through November 16, 2026. The footnote will terminate on December 1, 2026.","153":"Effective November 1, 2026 , the maximum lodging rate will increase for Shenzhen, China. Please note that there is no adjustment to the meals or incidental expenses. Two temporary lodging rate increases are established for USG travelers who are attending the APEC Economic Leaders' Week (AELW). The maximum lodging rate is $810 per night during November 1, 2026 through November 14, 2026 and November 22, 2026 through November 30, 2026. The maximum loading rate is $1,770 per night during November 15, 2026 through November 21, 2026. Travelers are expected to reserve standard, reasonable accommodation. As an official traveler you are subject to the prudent traveler rule, which requires official travelers to exercise the same care in incurring additional expenses as they would in personal circumstances. The footnote will terminate on December 1, 2026."};

  <div class="panel"><h2>Backup</h2><div class="row"><div style="flex:0 0 auto"><button class="btn ghost" id="exp">Copy data</button></div><div style="flex:2 1 200px"><label for="imp">Paste data to restore</label><input id="imp"></div><div style="flex:0 0 auto"><button class="btn ghost" id="impb">Restore</button></div></div>
  <p class="mute" id="bk">Data lives only in this browser, so copy a backup now and then.</p></div>`;
}

/* ---------- Day editor: right-click / long-press ---------- */
const LIM={uta:2,ftp:2,gtp:1},KN={uta:'UTA period',ftp:'FTP',gtp:'GTP'},KL={uta:'UTA period',ftp:'FTP (flying)',gtp:'GTP (ground)'},DAYMAX=2;
let ED=null;
const extraUta=D=>S.duty.filter(x=>x.type==='uta'&&!x.slot&&x.date===D).reduce((a,x)=>a+(+x.units||1),0);
function utaPlan(D,R){
  const d=pd(D),base='uta-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-p',sl=S.slots||{},keep=new Set(R.filter(r=>r.k==='uta'&&(r.sel||r.id)).map(r=>r.sel||r.id));
  const open=[1,2,3,4].map(n=>base+n).filter(id=>!keep.has(id)&&(!(sl[id]&&sl[id].date)||sl[id].date===D));
  let i=0;return R.map(r=>r.k!=='uta'?null:(r.sel||r.id||open[i++]||''));
}
/* every UTA period in the date's fiscal year, date's own month first */
function utaOptions(D,plan,i){
  const d=pd(D),fy=fyOf(d),sl=S.slots||{},mine=plan[i],others=new Set(plan.filter((p,j)=>p&&j!==i));
  const opt=id=>{const u=sl[id]&&sl[id].date&&sl[id].date!==D?sl[id].date:'',taken=others.has(id),dis=(u||taken)&&id!==mine;
    return `<option value='${id}' ${id===mine?'selected':''} ${dis?'disabled':''}>${utaLbl(id)}${u?' \u2014 used '+fmt(u):taken?' \u2014 in use above':''}</option>`};
  const per=(y,m)=>[1,2,3,4].map(n=>'uta-'+y+'-'+m+'-p'+n);
  const own=per(d.getFullYear(),d.getMonth()+1),rest=[];
  for(let k=0;k<12;k++){const x=new Date(fy-1,9+k,1);if(x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear())continue;rest.push(`<optgroup label='${x.toLocaleDateString(undefined,{month:'long',year:'numeric'})}'>${per(x.getFullYear(),x.getMonth()+1).map(opt).join('')}</optgroup>`)}
  return (mine?'':`<option value='' selected disabled>No open period this month: pick one</option>`)+`<optgroup label='${d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}'>${own.map(opt).join('')}</optgroup>`+rest.join('');
}
function edOpen(date,addKind){
  const rows=[],sl=S.slots||{};
  S.duty.filter(d=>d.type==='uta'&&d.slot&&d.date===date).sort((a,b)=>a.slot.localeCompare(b.slot)).forEach(d=>rows.push({k:'uta',id:d.slot,ps:d.ps||'none',note:(sl[d.slot]||{}).memo||'',start:(sl[d.slot]||{}).start||d.start||'',end:(sl[d.slot]||{}).end||d.end||''}));
  const v=(S.tpd||{})[date];TPK.forEach(([k])=>tpList(v,k).forEach(it=>rows.push({k,ps:it.ps,note:it.note,sdate:it.sdate,pdate:it.pdate,start:it.start,end:it.end})));
  const back=document.activeElement;
  CAL.sel=date;const d=pd(date);CAL.y=d.getFullYear();CAL.m=d.getMonth();render();
  ED={date,rows,err:'',dataKey:date};
  document.body.classList.add('lock');
  if(addKind&&edCanAdd(addKind)){ED.rows.push({k:addKind,ps:'none',note:'',start:'',end:''});edRender();const el=$('#est'+(ED.rows.length-1));if(el)el.focus({preventScroll:true})}
  else edRender(true);
}
function edClose(){ED=null;document.body.classList.remove('lock');$('#modal').innerHTML='';}
function edCount(k){return ED.rows.filter(r=>r.k===k).length+(k==='uta'?extraUta(ED.date):0)}
function edUsed(){return ED.rows.length+extraUta(ED.date)}
function edCanAdd(k){return edUsed()<DAYMAX&&edCount(k)<LIM[k]}
function edRender(focus){
  const m=$('#modal');if(!ED){m.innerHTML='';return}
  const D=ED.date,plan=utaPlan(D,ED.rows),ex=extraUta(D),used=edUsed();
  const other=(calEvents()[D]||[]).filter(e=>!e.slot&&e.k!=='tp');
  const rowsHtml=ED.rows.map((r,i)=>{const auto=r.k==='uta'&&!r.sel&&!r.id&&plan[i];
    return `<div class='prow k-${r.k}'><div class='hd'><span><span class='chip k-${r.k}'>${KL[r.k]}</span></span><button class='btn ghost sm' data-rm='${i}' aria-label='Remove ${KN[r.k]}'>Remove</button></div>
    ${r.k==='uta'?`<div class='w' style='grid-column:1/-1'><label for='eper${i}'>Period${auto?' <span>(next open)</span>':''}</label><select id='eper${i}' data-eper='${i}'${plan[i]?'':" style='border-color:var(--bad)'"}>${utaOptions(D,plan,i)}</select></div>`:''}
    <div><label for='est${i}'>Start (24 h)</label><input type='text' inputmode='numeric' maxlength='5' autocomplete='off' placeholder='HHMM' class='t24' id='est${i}' data-est='${i}' value='${t24v(r.start)}'></div>
    <div><label for='eet${i}'>End (24 h)${hrs(r.start,r.end)?` <span data-hl='${i}'>(${hrs(r.start,r.end).toFixed(1)} h)</span>`:` <span data-hl='${i}'></span>`}</label><input type='text' inputmode='numeric' maxlength='5' autocomplete='off' placeholder='HHMM' class='t24' id='eet${i}' data-eet='${i}' value='${t24v(r.end)}'></div>
    <div class='w'><label for='eps${i}'>Pay status</label><select id='eps${i}' data-eps='${i}'>${PS.map(([k,n])=>`<option value='${k}' ${r.ps===k?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class='w'><label for='en${i}'>Note</label><input id='en${i}' data-en='${i}' value='${esc(r.note)}' placeholder='What it was' maxlength='120' autocomplete='off'></div></div>`}).join('');
  const addBtn=k=>{const ok=edCanAdd(k),why=used>=DAYMAX?'Day is full (2 max)':edCount(k)>=LIM[k]?`${KN[k]} limit is ${LIM[k]} per day`:'';return `<button class='btn ghost' data-add='${k}' ${ok?'':'disabled'} title='${why}' aria-label='Add ${KN[k]}${why?', '+why:''}'>+ ${KN[k]}</button>`};
  m.innerHTML=`<div class='ov' id='ovl'><div class='dlg' role='dialog' aria-modal='true' aria-labelledby='edt'>
   <div style='display:flex;justify-content:space-between;align-items:start;gap:10px'><div><h2 id='edt'>${pd(D).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2><div class='mute'>${used} of ${DAYMAX} pay statuses used${pd(D)>today()?' · planned':''}</div></div><button class='btn ghost sm' id='edx' aria-label='Close'>✕</button></div>
   ${ex?`<div class='tip warn' style='font-size:13px'>${ex} UTA period(s) from the duty log already count toward this day.</div>`:''}
   ${rowsHtml||`<div class='empty'>No pay statuses on this day yet. Add one below.</div>`}
   <div class='adds'>${addBtn('uta')}${addBtn('ftp')}${addBtn('gtp')}</div>
   <p class='mute' style='margin:0'>Up to 2 per day, in any mix: UTA periods (2 max), FTPs (2 max), GTP (1 max).</p>
   ${other.length?`<div style='margin-top:10px'><div class='mute'>Also on this day</div>${other.map(e=>`<div class='tip' style='font-size:13px;margin:4px 0'>${esc(e.t)}</div>`).join('')}</div>`:''}
   <div class='err' id='ederr' role='alert'>${esc(ED.err)}</div>
   <div class='row' style='justify-content:flex-end'><div style='flex:0 0 auto'><button class='btn ghost' id='edc'>Cancel</button></div><div style='flex:0 0 auto'><button class='btn' id='eds'>Save</button></div></div>
  </div></div>`;
  const ov=$('#ovl');ov.onpointerdown=e=>{ED.ovDown=e.target===ov};ov.onclick=e=>{if(e.target===ov&&ED&&ED.ovDown)edCancel()};
  $('#edx').onclick=edCancel;$('#edc').onclick=edCancel;$('#eds').onclick=edSave;
  m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add;if(!edCanAdd(k))return;ED.rows.push({k,ps:'none',note:'',start:'',end:''});ED.err='';edRender();const i=ED.rows.length-1,el=$('#est'+i);if(el)el.focus()});
  m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ED.rows.splice(+b.dataset.rm,1);ED.err='';edRender();const f=m.querySelector('[data-add]:not([disabled])')||$('#eds');if(f)f.focus()});
  m.querySelectorAll('[data-eper]').forEach(s=>s.onchange=()=>{const i=+s.dataset.eper;ED.rows[i].sel=s.value;ED.err='';edRender();const el=$('#eper'+i);if(el)el.focus()});
  m.querySelectorAll('[data-eps]').forEach(s=>s.onchange=()=>{ED.rows[+s.dataset.eps].ps=s.value});
  const hl=i=>{const r=ED.rows[i],h=hrs(r.start,r.end),el=m.querySelector(`[data-hl='${i}']`);if(el)el.textContent=h?`(${h.toFixed(1)} h)`:''};
  [['est','start'],['eet','end']].forEach(([a,f])=>m.querySelectorAll(`[data-${a}]`).forEach(s=>{const i=+s.dataset[a],bk=f==='start'?'badS':'badE';
    s.oninput=()=>{const v=p24(s.value),r=ED.rows[i];if(v===null){r[bk]=true;t24Mark(s,!(s.value.replace(/\D/g,'').length>=4))}else{r[bk]=false;r[f]=v;t24Mark(s,true)}hl(i)};
    s.onblur=()=>{const v=p24(s.value),r=ED.rows[i];if(v===null){r[bk]=true;t24Mark(s,false)}else{r[bk]=false;r[f]=v;s.value=t24v(v);t24Mark(s,true)}hl(i)}}));
  m.querySelectorAll('[data-en]').forEach(s=>{s.oninput=()=>{ED.rows[+s.dataset.en].note=s.value};s.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();edSave()}}});
  if(focus){const f=m.querySelector('[data-add]:not([disabled])')||$('#eds');if(f)f.focus({preventScroll:true})}
}
function edCancel(){const k=ED&&ED.dataKey;edClose();if(k){const b=document.querySelector(`[data-cd='${k}']`);if(b)b.focus({preventScroll:true})}}
function edErr(t){ED.err=t;const e=$('#ederr');if(e)e.textContent=t;return false}
function edSave(){
  const D=ED.date,R=ED.rows.map(r=>({...r,note:(r.note||'').trim()})),ex=extraUta(D),c=k=>R.filter(r=>r.k===k).length+(k==='uta'?ex:0);
  if(R.some(r=>r.badS||r.badE))return edErr('Enter times as 24-hour HHMM, for example 0730 or 1630.');
  if(R.length+ex>DAYMAX)return edErr(`A day can hold at most ${DAYMAX} pay statuses. Remove ${R.length+ex-DAYMAX}.`);
  for(const k of ['uta','ftp','gtp'])if(c(k)>LIM[k])return edErr(`Only ${LIM[k]} ${KN[k]}${LIM[k]>1?'s':''} allowed per day.`);
  const plan=utaPlan(D,R);
  if(plan.some((p,i)=>R[i].k==='uta'&&!p))return edErr(`All 4 UTA periods for ${pd(D).toLocaleDateString(undefined,{month:'long'})} are used. Pick a period from another month in the Period list.`);
  {const sl=S.slots||{},u=plan.filter(Boolean);if(new Set(u).size!==u.length)return edErr('Two entries use the same UTA period. Pick a different one.');
   const busy=u.find(id=>sl[id]&&sl[id].date&&sl[id].date!==D);if(busy)return edErr(`${utaLbl(busy)} is already used on ${fmt(sl[busy].date)}. Pick a different period.`)}
  const w=fyWindow(),d=pd(D);
  if(d>=w.s&&d<=w.e){const tot=tpGet(),cur=(S.tpd||{})[D]||{},now=(cur.ftp||0)+(cur.gtp||0),nw=c('ftp')+c('gtp');if(tot.ftp+tot.gtp-now+nw>72)return edErr('That would put you over 72 FTP + GTP for the fiscal year.')}
  if(!S.slots)S.slots={};
  const old=S.duty.filter(x=>x.type==='uta'&&x.slot&&x.date===D).map(x=>x.slot),keepIds=new Set(plan.filter(Boolean));
  old.filter(id=>!keepIds.has(id)).forEach(id=>{S.slots[id]=Object.assign({},S.slots[id],{date:'',memo:'',start:'',end:''});applySlot(id,'uta')});
  R.forEach((r,i)=>{if(r.k!=='uta')return;const id=plan[i];S.slots[id]=Object.assign({date:''},S.slots[id],{date:D,memo:r.note,start:r.start||'',end:r.end||''});applySlot(id,'uta');setPs(S.duty.find(x=>x.slot===id),r.ps)});
  const mk=k=>R.filter(r=>r.k===k).map(r=>{const o={ps:r.ps,note:r.note,start:r.start||'',end:r.end||'',sdate:r.sdate||'',pdate:r.pdate||''};setPs(o,r.ps);return o});
  const fx=mk('ftp'),gx=mk('gtp');if(!S.tpd)S.tpd={};
  if(fx.length||gx.length)S.tpd[D]={ftp:fx.length,gtp:gx.length,fx,gx};else delete S.tpd[D];
  save();const k=ED.dataKey;edClose();render();
  if(k){const b=document.querySelector(`[data-cd='${k}']`);if(b)b.focus({preventScroll:true})}
}
document.addEventListener('keydown',e=>{
  if(!ED)return;
  if(e.key==='Escape'){e.preventDefault();edCancel();return}
  if(e.key==='Tab'){const f=[...$('#modal').querySelectorAll('button:not([disabled]),input,select')];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
/* long-press + right-click on calendar days */
const LP={h:0,x:0,y:0,fired:false,touch:false,el:null};
function lpClear(){clearTimeout(LP.h);LP.h=0;if(LP.el)LP.el.classList.remove('press');LP.el=null}
function bindDays(){
  document.querySelectorAll('[data-cd]').forEach(b=>{
    const k=b.dataset.cd;
    b.onclick=()=>{if(LP.fired){LP.fired=false;return}CAL.sel=k;const d=pd(k);CAL.y=d.getFullYear();CAL.m=d.getMonth();render()};
    b.oncontextmenu=e=>{e.preventDefault();lpClear();if(ED)return;LP.fired=LP.touch;edOpen(k)};
    b.onpointerdown=e=>{LP.touch=e.pointerType!=='mouse';LP.fired=false;if(!LP.touch)return;lpClear();LP.x=e.clientX;LP.y=e.clientY;LP.el=b;
      b.classList.add('press');
      LP.h=setTimeout(()=>{lpClear();if(ED)return;LP.fired=true;try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}edOpen(k)},480)};
    b.onpointermove=e=>{if(LP.h&&(Math.abs(e.clientX-LP.x)>10||Math.abs(e.clientY-LP.y)>10))lpClear()};
    b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{if(LP.h)lpClear()};
  });
}
document.addEventListener('scroll',()=>{if(LP.h)lpClear()},{passive:true,capture:true});
/* swallow the click that follows a long-press release so it can't hit the dialog */
document.addEventListener('pointerdown',()=>{LP.fired=false},true);
document.addEventListener('click',e=>{if(LP.fired){LP.fired=false;e.preventDefault();e.stopPropagation()}},true);

function bind(){

  [["#sr",v=>S.rate=Number(v)||0],["#sy",v=>S.yearStart=v],["#sm",v=>S.member=Number(v)||0]].forEach(([s,f])=>{const e=$(s);if(e)e.onchange=()=>{f(e.value);save()}});

  document.querySelectorAll("[data-delv]").forEach(b=>b.onclick=()=>{S.vouchers.splice(+b.dataset.delv,1);save();render()});
  document.querySelectorAll("[data-man]").forEach(e=>e.onchange=()=>{S.duty[+e.dataset.man].manual=e.value===""?"":Number(e.value);save();render()});
  document.querySelectorAll("[data-ps]").forEach(e=>e.onchange=()=>{setPs(S.duty[+e.dataset.ps],e.value);save();render()});
  const pg=$('#pg');if(pg)pg.onchange=()=>{S.grade=pg.value;save();render()};
  const pc=$('#pc');if(pc)pc.onchange=()=>{S.col=+pc.value;save();render()};
  const fpt=$('#fpt');if(fpt)fpt.onchange=()=>{S.fp={type:fpt.value,tier:0,manual:(S.fp||{}).manual||''};save();render()};
  const fpg=$('#fpg');if(fpg)fpg.onchange=()=>{S.fp.tier=+fpg.value;save();render()};
  const fpm=$('#fpm');if(fpm)fpm.onchange=()=>{S.fp.manual=fpm.value;save();render()};
  q('#usefp',()=>{const m=curPay().m,fm=fpMonthly();S.rate=Math.round((m+fm)/30*100)/100;save();render()});
  q('#usepay',()=>{const m=curPay().m;if(m){S.rate=Math.round(m/30*100)/100;save();render()}});
  pdBind();exBind();
  q('#bib',()=>{const rows=$('#bi').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(r=>r.length>=3&&r[1]);let n=0;const t=today();rows.forEach(r=>{const iv=parseInt(r[2])||0;if(iv<1)return;const cat=['Flying','Ground','CBT'].find(c=>c.toLowerCase()===(r[0]||'').toLowerCase())||'Ground';const ok=/^\d{4}-\d{2}-\d{2}$/.test(r[3]||'');S.curr.push({cat,name:r[1],interval:iv,last:ok?r[3]:iso(addDays(t,-iv-1))});n++});if(n){save();render()}else $('#bim').textContent='No valid lines found. Use: category | name | days | date.'});
  bindDays();

  q('#cnext',()=>{const d=new Date(CAL.y,CAL.m+1,1);CAL.y=d.getFullYear();CAL.m=d.getMonth();render()});
  q('#ctoday',()=>{const t=today();CAL.y=t.getFullYear();CAL.m=t.getMonth();CAL.sel=iso(t);render()});
  q('#cedit',()=>edOpen(CAL.sel));
  document.querySelectorAll('[data-qadd]').forEach(b=>b.onclick=()=>edOpen(CAL.sel,b.dataset.qadd));
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>edOpen(b.dataset.open));
  document.querySelectorAll('[data-sd]').forEach(e=>e.onchange=()=>{const[id,kind]=e.dataset.sd.split('|');setSlot(id,kind,{date:e.value})});
  document.querySelectorAll('[data-tpdel]').forEach(b=>b.onclick=()=>{delete S.tpd[b.dataset.tpdel];save();render()});
  q('#tpclr',()=>{if(S.tpq)delete S.tpq[fyKey()];save();render()});
  document.querySelectorAll('[data-tm]').forEach(e=>e.onchange=()=>{const[i,f]=e.dataset.tm.split('|'),d=S.duty[+i],v=p24(e.value);if(!d)return;if(v===null){t24Mark(e,false);return}if(d.slot)setSlot(d.slot,d.type,{[f]:v});else{d[f]=v;save();render()}});
